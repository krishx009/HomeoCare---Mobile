name: homeocare
description: "Homeocare - Homeopathic Clinic Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  
  # State Management
  provider: ^6.1.2
  
  # API & Network
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  
  # File Handling
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3
  
  # Date & Time
  intl: ^0.19.0
  
  # Phone Input
  intl_phone_field: ^3.2.0
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Image Compression
  flutter_image_compress: ^2.3.0
  
  # UUID Generation
  uuid: ^4.5.1
  
  # Toast Messages
  fluttertoast: ^8.2.8
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Smooth Page Indicator (for onboarding)
  smooth_page_indicator: ^1.2.0+3
  
  # URL Launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

